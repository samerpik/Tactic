<title>Match Replay — Proof of Concept</title>
<style>
  :root {
    --bg: #0a1220;
    --panel: rgba(16, 27, 44, .85);
    --text: #e9eef5;
    --muted: #7d90a8;
    --accent: #59c1ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #12203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  header { text-align: center; padding: 18px 16px 10px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  header h1 em { color: var(--accent); font-style: normal; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px 18px; }
  canvas { max-width: 100%; max-height: 100%; border-radius: 14px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
  #bar {
    width: min(860px, 92vw);
    display: flex; align-items: center; gap: 14px;
    background: var(--panel);
    border: 1px solid #22344e;
    border-radius: 14px;
    padding: 10px 16px;
    margin: 6px 0 18px;
    backdrop-filter: blur(6px);
  }
  #btnPlay {
    background: var(--accent); border: none; color: #06121f;
    width: 42px; height: 42px; border-radius: 50%;
    font-size: 16px; cursor: pointer; flex-shrink: 0; font-weight: 700;
  }
  #seek { flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer; }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; width: 108px; text-align: right; white-space: nowrap; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #btnStats {
    background: none; border: 1px solid #2c4360; color: var(--muted);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    letter-spacing: .4px; flex-shrink: 0;
  }
  #btnStats.on { color: var(--accent); border-color: var(--accent); }
  #poss {
    width: min(860px, 92vw);
    display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--muted);
    margin: 2px 0 0;
    font-variant-numeric: tabular-nums;
  }
  #possTrack { flex: 1; height: 7px; border-radius: 4px; overflow: hidden; display: flex; background: #22344e; }
  #possCity { background: #6ec1ea; height: 100%; width: 50%; transition: width .3s linear; }
  #possSpurs { background: #f2f5f8; height: 100%; flex: 1; }
  #tact {
    width: min(860px, 92vw);
    display: flex; flex-direction: column; gap: 3px;
    font-size: 12px; color: var(--muted);
    margin-top: 4px;
  }
  #tact .row { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow-x: auto; }
  #tact .chip { color: var(--text); background: #1a2c45; border: 1px solid #2c4360; border-radius: 6px; padding: 1px 7px; cursor: default; }
  #tact .tname { min-width: 44px; font-weight: 600; }
</style>

<header>
  <h1>Man City <em>0–0</em> Tottenham · the Kulusevski build-up</h1>
  <p>Player and ball positions extracted automatically from tactical-camera footage — proof of concept</p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div id="poss">
  <span id="possL">City 50%</span>
  <div id="possTrack"><div id="possCity"></div><div id="possSpurs"></div></div>
  <span id="possR">50% Spurs</span>
  <span style="color:#4a5f78">· possession</span>
</div>
<div id="tact"></div>
<div id="bar">
  <button id="btnPlay" title="Play / pause">❚❚</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="clock">03:35 · 0.0s</span>
  <span class="legend">
    <span><span class="dot" style="background:#6ec1ea"></span>City</span>
    <span><span class="dot" style="background:#f2f5f8"></span>Spurs</span>
    <span><span class="dot" style="background:#f6b93b"></span>Ball</span>

  <button id="btnStats" class="on" title="Speed &amp; distance per player">STATS</button>

</div>

function drawPitch() {

  ctx.fillRect(0, 0, cv.width, cv.height);
  const g = ctx.createLinearGradient(0, Y(0), 0, Y(PH));
  g.addColorStop(0, "#2c9243"); g.addColorStop(1, "#1f7434");
  ctx.fillStyle = g;

  ctx.fillStyle = "rgba(255,255,255,0.045)";

  for (let i = 0; i < 14; i += 2) ctx.fillRect(X(i*st), Y(0), st*S*DPR, PH*S*DPR);
  ctx.strokeStyle = "rgba(255,255,255,.9)";

  ctx.strokeRect(X(0), Y(0), PW*S*DPR, PH*S*DPR);
  ctx.beginPath(); ctx.moveTo(X(52.5), Y(0)); ctx.lineTo(X(52.5), Y(PH)); ctx.stroke();

    ctx.strokeRect(X(Math.min(x, x+d*16.5)), Y(34-20.16), 16.5*S*DPR, 40.32*S*DPR);
    ctx.strokeRect(X(Math.min(x, x+d*5.5)), Y(34-9.16), 5.5*S*DPR, 18.32*S*DPR);

}

/* --- speed, distance & possession, computed from the extracted samples ---
   speed: central difference over a 1s window, only across samples where the
   player was actually observed (held positions would read as 0 or a jump);
   distance: cumulative sum of observed steps, identity jumps (>6m/0.5s) skipped;
   possession: team of the nearest player within 3m of the ball, carried
   forward through contested/loose moments. */
const SLOTS = Object.keys(DATA.frames[N-1].p);

  for (let i = 0; i < N; i++) {
    const a = Math.max(0, i-1), b = Math.min(N-1, i+1);
    const pa = DATA.frames[a].p[slot], pb = DATA.frames[b].p[slot];
    if (pa && pb && b > a && obsAt(a).has(slot) && obsAt(b).has(slot) && obsAt(i).has(slot)) {
      const v = Math.hypot(pb[0]-pa[0], pb[1]-pa[1]) / (T[b]-T[a]) * 3.6;
      if (v <= 34) sp[i] = v;
    }
    if (i > 0) {
      const q = DATA.frames[i-1].p[slot], r = DATA.frames[i].p[slot];
      let step = 0;
      if (q && r && obsAt(i-1).has(slot) && obsAt(i).has(slot)) {
        const d = Math.hypot(r[0]-q[0], r[1]-q[1]);

}

{
  let lastTeam = null, h = 0, a = 0;
  for (let i = 0; i < N; i++) {
    const f = DATA.frames[i], o = obsAt(i);
    let best = null, bd = 3.0;
    for (const slot of SLOTS) {
      if (slot === "H1" || slot === "A1" || !f.p[slot] || !o.has(slot)) continue;
      const d = Math.hypot(f.p[slot][0]-f.b[0], f.p[slot][1]-f.b[1]);
      if (d < bd) { best = slot; bd = d; }
    }
    if (best) lastTeam = best[0];
    if (lastTeam === "H") h++; else if (lastTeam === "A") a++;
    POSS.push(h + a ? h / (h + a) : 0.5);
  }
}
function statAt(arr, t) {
  let i = 0;
  while (i < N - 2 && T[i+1] <= t) i++;
  const v1 = arr[i], v2 = arr[i+1];
  if (v1 == null || v2 == null) return v1 != null ? v1 : v2;
  const u = Math.max(0, Math.min(1, (t - T[i]) / (T[i+1] - T[i])));
  return v1 + (v2 - v1) * u;
}

/* --- auto-derived tactical profile (aggregate over the passage) ---------
   compactness / width / depth from observed outfield positions per frame,
   block height from the team centroid's distance to its own goal (known
   from the keeper's side), transition tempo from the speed layer. Each
   label carries the metric it came from — hover a chip for the reason. */
function tacticalProfile(prefix) {
  const outf = SLOTS.filter(s => s[0] === prefix && s !== prefix + "1");
  const comp = [], wid = [], dep = [], cxs = [];
  for (let i = 0; i < N; i++) {
    const f = DATA.frames[i], o = new Set(f.o || []);
    const pts = outf.filter(s => f.p[s] && o.has(s)).map(s => f.p[s]);
    if (pts.length < 4) continue;
    const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
    const cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    comp.push(pts.reduce((a, p) => a + Math.hypot(p[0]-cx, p[1]-cy), 0) / pts.length);
    wid.push(Math.sqrt(pts.reduce((a, p) => a + (p[1]-cy)**2, 0) / pts.length));
    dep.push(Math.sqrt(pts.reduce((a, p) => a + (p[0]-cx)**2, 0) / pts.length));
    cxs.push(cx);
  }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const gk = DATA.frames.map(f => f.p[prefix + "1"]).filter(Boolean);
  const ownGoal = gk.length ? (avg(gk.map(p => p[0])) < 52.5 ? 0 : 105)
                            : (avg(cxs) >= 52.5 ? 0 : 105);
  const speeds = [];
  for (const s of outf) for (const v of SPEED[s]) if (v != null) speeds.push(v);
  const m = { comp: avg(comp), wid: avg(wid), dep: avg(dep),
              block: Math.abs(avg(cxs) - ownGoal), spd: avg(speeds) };
  const compL = m.comp < 18 ? "Compact" : m.comp > 26 ? "Wide" : "Balanced";
  const pressL = m.block > 58 ? "High Press" : m.block < 40 ? "Low Block" : "Mid Block";
  const transL = m.spd > 9.5 ? "Fast transitions" : m.spd < 7 ? "Slow transitions" : "Medium tempo";
  const buildL = (m.dep > 22 || m.spd > 9.5) ? "Direct" :
                 (m.dep < 16 && m.spd <= 9.5) ? "Short passing" : "Mixed build-up";
  return [
    [compL, `players average ${m.comp.toFixed(1)} m from the team centroid`],
    [pressL, `block ~${m.block.toFixed(0)} m up from its own goal`],
    [buildL, `${m.dep.toFixed(1)} m vertical spread at ${m.spd.toFixed(1)} km/h average`],
    [transL, `average outfield speed ${m.spd.toFixed(1)} km/h over the passage`],

}
{
  const el = document.getElementById("tact");
  for (const [prefix, name, col] of [["H", "City", "#6ec1ea"], ["A", "Spurs", "#f2f5f8"]]) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="tname" style="color:${col}">${name}</span>` +
      tacticalProfile(prefix).map(([l, r]) => `<span class="chip" title="${r}">${l}</span>`).join("") +
      (prefix === "A" ? `<span style="color:#4a5f78">· tactics, auto-derived — hover for why</span>` : "");
    el.appendChild(row);
  }
}

function kitOf(slot) {

  if (slot === "A1") return { fill: "#f0842c", text: "#4a2404", ring: "#ffd9b3" };   // Lloris orange
  if (slot[0] === "H") return { fill: "#6ec1ea", text: "#0d2f45", ring: "#dff2fd" }; // City sky blue

  trail.push([...b, t]);
  while (trail.length && t - trail[0][2] > 2.2) trail.shift();
  if (trail.length > 1) {
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i-1], c = trail[i];
      ctx.strokeStyle = `rgba(246,185,59,${0.08 + 0.42 * (i / trail.length)})`;
      ctx.lineWidth = 2.4 * DPR;
      ctx.beginPath(); ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(c[0]), Y(c[1])); ctx.stroke();
    }
  }
  // players
  let ni = 0;
  while (ni < N - 1 && T[ni+1] <= t + 0.25) ni++;
  const obsNow = new Set(DATA.frames[ni].o || []);
  for (const slot of Object.keys(DATA.frames[N-1].p)) {
    const p = sampleSlot(slot, t);
    if (!p) continue;
    const k = kitOf(slot);

    const r = 1.55 * S * DPR;
    ctx.beginPath(); ctx.ellipse(X(p[0]), Y(p[1]) + r*0.35, r*1.1, r*0.72, 0, 0, 7);
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fill();
    ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), r, 0, 7);
    ctx.fillStyle = k.fill; ctx.fill();
    ctx.lineWidth = 1.4 * DPR; ctx.strokeStyle = k.ring; ctx.stroke();
    ctx.fillStyle = k.text;
    ctx.font = `bold ${1.35*S*DPR}px -apple-system, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(slot.slice(1), X(p[0]), Y(p[1]) + 0.5);

    if (statsOn && slot !== "H1" && slot !== "A1") {
      const sp = statAt(SPEED[slot], t), dc = statAt(DIST[slot], t);
      if (sp != null && sp >= 1) {
        ctx.font = `600 ${0.95*S*DPR}px -apple-system, sans-serif`;
        ctx.fillStyle = "rgba(0,0,0,.55)";
        ctx.fillText(`${sp.toFixed(0)} km/h`, X(p[0]) + 1*DPR, Y(p[1]) + r + 1.05*S*DPR + 1*DPR);
        ctx.fillStyle = "rgba(255,255,255,.92)";
        ctx.fillText(`${sp.toFixed(0)} km/h`, X(p[0]), Y(p[1]) + r + 1.05*S*DPR);
      }
      if (dc != null && dc >= 5) {
        ctx.font = `500 ${0.8*S*DPR}px -apple-system, sans-serif`;
        ctx.fillStyle = "rgba(233,238,245,.55)";
        ctx.fillText(`${dc.toFixed(0)} m`, X(p[0]), Y(p[1]) + r + 1.95*S*DPR);
      }
    }
  }
  // ball
  const br = 0.75 * S * DPR;
  ctx.beginPath(); ctx.arc(X(b[0]), Y(b[1]), br, 0, 7);
  ctx.fillStyle = "#f6b93b"; ctx.fill();
  ctx.lineWidth = 1.2 * DPR; ctx.strokeStyle = "#7a5410"; ctx.stroke();

  const mm = 3, ss = 35 + t;
  const clk = `0${mm}:${String(Math.floor(ss)).padStart(2, "0")}`;
  document.getElementById("clock").textContent = `${clk} · ${t.toFixed(1)}s`;
  document.getElementById("seek").value = Math.round(1000 * t / DUR);

  const share = statAt(POSS, t);
  const cityPct = Math.round(share * 100);
  document.getElementById("possCity").style.width = (share * 100).toFixed(1) + "%";
  document.getElementById("possL").textContent = `City ${cityPct}%`;
  document.getElementById("possR").textContent = `${100 - cityPct}% Spurs`;
}

function tick(ts) {
  if (playing) {
    if (last) t += (ts - last) / 1000;
    if (t >= DUR) { t = 0; trail = []; }
    draw();
  }
  last = ts;
  requestAnimationFrame(tick);
}

document.getElementById("btnPlay").onclick = () => {
  playing = !playing;
  document.getElementById("btnPlay").textContent = playing ? "❚❚" : "▶";
};
document.getElementById("seek").addEventListener("input", e => {
  t = DUR * e.target.value / 1000; trail = []; draw();
});
document.getElementById("btnTact").onclick = () => {
  const el = document.getElementById("tact"), btn = document.getElementById("btnTact");
  const on = el.style.display !== "none";
  el.style.display = on ? "none" : "";
  btn.style.color = on ? "var(--muted)" : "var(--accent)";
  btn.style.borderColor = on ? "#2c4360" : "var(--accent)";
};
document.getElementById("btnStats").onclick = () => {
  statsOn = !statsOn;
  document.getElementById("btnStats").classList.toggle("on", statsOn);
  draw();
};
window.addEventListener("keydown", e => { if (e.key === " ") { e.preventDefault(); document.getElementById("btnPlay").click(); } });

fit();
draw();
requestAnimationFrame(tick);
</script>
